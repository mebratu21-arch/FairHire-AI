name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Build Apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Run build
        working-directory: apps/${{ matrix.app }}
        run: npm run build

  docker-build-and-scan:
    name: Build & Scan Docker Images
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          load: true
          tags: fairhire-${{ matrix.service }}:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fairhire-${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fairhire-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fairhire-${{ matrix.service }}:latest

  deploy:
    name: Deploy to Production VPS
    needs: [docker-build-and-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync compose and infra configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=accept-new" \
            docker-compose.prod.yml infra/ scripts/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/fairhire/"

      - name: Deploy containers via safely quoted remote script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ github.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s -- "${IMAGE_TAG}" "${REPO_OWNER}" << 'REMOTE_SCRIPT'
          set -euo pipefail
          cd /opt/fairhire
          export TAG="$1"
          export OWNER="$2"
          
          # Pull newest images
          docker compose -f docker-compose.prod.yml pull web api
          
          # Rolling zero-downtime recreation
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          
          # Clean up dangling images safely
          docker image prune -f
          REMOTE_SCRIPT
