services:
  caddy:
    image: caddy:2
    ports: ['80:80', '443:443']
    environment: [DOMAIN]
    volumes: ['./infra/Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data']
    networks: [edge, app]
    restart: unless-stopped
  web:
    image: ghcr.io/${OWNER}/fairhire-web:${TAG}
    build: ./apps/web
    networks: [app]
    read_only: true
    tmpfs: ['/tmp', '/app/.next/cache']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
  api:
    image: ghcr.io/${OWNER}/fairhire-api:${TAG}
    build: ./apps/api
    environment: [DATABASE_URL]
    networks: [app, data]
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fairhire
      POSTGRES_DB: fairhire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ['pgdata:/var/lib/postgresql/data']
    networks: [data]
    restart: unless-stopped
networks:
  edge: {}
  app: {}
  data: { internal: true }
volumes: { caddy_data: {}, pgdata: {} }
